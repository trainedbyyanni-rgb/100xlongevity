<!-- ==========================================================================
     EDGE-TUCKED NAV — insert immediately inside <body>, before any
     other content, on every page (index.html, coaching.html, videos.html,
     sources.html, blog/index.html, blog/post files, cognitive/index.html,
     cognitive lesson pages).

     Adjust the href values per page — the ones below assume this file
     sits at the site root. Pages inside blog/ or cognitive/ need "../"
     prefixed to each link.
     ========================================================================== */
-->

<nav class="site-nav">
  <a href="/index.html" class="site-nav__mark">100X Yanni</a>

  <ul class="site-nav__links">
    <li><a href="/index.html">Home</a></li>
    <li><a href="/cognitive/index.html">Cognitive</a></li>
    <li><a href="/videos.html">Videos</a></li>
    <li><a href="/sources.html">Sources</a></li>
    <li><a href="/coaching.html">Coaching</a></li>
  </ul>

  <button class="site-nav__toggle" aria-label="Open menu" aria-expanded="false">
    Menu
  </button>

  <div class="site-nav__overlay">
    <a href="/index.html">Home</a>
    <a href="/cognitive/index.html">Cognitive</a>
    <a href="/videos.html">Videos</a>
    <a href="/sources.html">Sources</a>
    <a href="/coaching.html">Coaching</a>
  </div>
</nav>

<!-- ==========================================================================
     NAV TOGGLE SCRIPT — insert before closing </body>, once per page.
     Vanilla JS, no dependencies. Safe to include on every page even if
     the overlay never opens (e.g. desktop-only visits).
     ========================================================================== */
-->

<script>
  (function () {
    const toggle = document.querySelector('.site-nav__toggle');
    const overlay = document.querySelector('.site-nav__overlay');
    if (!toggle || !overlay) return;

    toggle.addEventListener('click', function () {
      const isOpen = overlay.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggle.textContent = isOpen ? 'Close' : 'Menu';
      document.body.style.overflow = isOpen ? 'hidden' : '';
    });

    // Close overlay when a link inside it is clicked
    overlay.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        overlay.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'Menu';
        document.body.style.overflow = '';
      });
    });
  })();
</script>
